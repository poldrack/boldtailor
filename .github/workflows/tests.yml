name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run python scripts/notebook_sync.py --check-tracked
      - name: Reconstruct and execute HRF reports from Python sources
        run: uv run pytest -q experiments/hrf_estimation/test_results_notebook.py experiments/hrf_estimation/test_autodiff_notebook.py experiments/hrf_estimation/test_all_methods_notebook.py experiments/hrf_estimation/test_session_comparison_notebook.py experiments/hrf_estimation/test_regularized_notebook.py
      - run: uv run pytest -q -W error --cov=boldtailor --cov-report=xml
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: uv run black --check src tests examples/bids_workflow
      - run: git diff --check
      - run: uv build --wheel
      - run: uv run --isolated --no-project --with "$(ls dist/boldtailor-*.whl)" python tests/check_installed_package.py
  examples:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --group dev
      - run: uv run pytest -q -W error --run-notebooks examples/bids_workflow examples/validation
