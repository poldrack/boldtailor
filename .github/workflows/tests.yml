name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'
      - run: uv sync --group dev
      - run: uv run python scripts/notebook_sync.py --check-tracked
      - run: uv run pytest -q -W error --cov=boldtailor --cov-report=xml --durations=20
      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - run: uv run black --check src tests examples/bids_workflow
      - run: git diff --check
      - run: uv build --wheel
      - run: uv run --isolated --no-project --with "$(ls dist/boldtailor-*.whl)" python tests/check_installed_package.py
