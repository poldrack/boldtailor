[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boldtailor"
version = "0.1.0"
description = "Composable first-level fMRI modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "filelock",
  "joblib>=1.3",
  "matplotlib>=3.11.1",
  "nibabel>=5.2",
  "nilearn>=0.14.0,<0.15",
  "numpy",
  "pandas",
  "scipy>=1.18.0",
]

[project.scripts]
boldtailor = "boldtailor.cli:main"

[dependency-groups]
dev = [
  "black",
  "ipykernel>=7.3.0",
  "matplotlib>=3.11.1",
  "nbclient>=0.11.0",
  "pytest",
  "pytest-cov",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"boldtailor._resources" = ["*.tsv", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
