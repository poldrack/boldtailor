[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[project]
name = "boldtailor"
version = "0.1.0"
description = "Optimized first-level fMRI modeling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/boldtailor/_resources/GLMsingle-LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
  "filelock",
  "joblib>=1.3",
  "matplotlib==3.11.2",
  "pillow==12.2.0",
  "nibabel>=5.4.2",
  "nilearn>=0.14.0,<0.15",
  "numpy==2.2.6",
  "pandas==2.3.2",
  "scikit-learn==1.7.2",
  "scipy==1.16.3",
  "h5py>=3.12,<4",
]

[project.scripts]
boldtailor = "boldtailor.cli:main"

[dependency-groups]
dev = [
  "black",
  "ipykernel>=7.3.0",
  "pyzmq==27.2.0",
  "jupytext>=1.19.6",
  "matplotlib>=3.11.1",
  "nbclient>=0.11.0",
  "pytest",
  "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
