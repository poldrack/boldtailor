[build-system]
requires = ["uv_build>=0.9.18,<0.10"]
build-backend = "uv_build"

[project]
name = "boldtailor"
version = "0.1.0"
description = "Composable first-level fMRI modeling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/boldtailor/_resources/GLMsingle-LICENSE.txt"]
requires-python = ">=3.12"
dependencies = [
  "filelock",
  "joblib>=1.3",
  "matplotlib>=3.11.1",
  "nibabel>=5.2",
  "nilearn>=0.14.0,<0.15",
  "numpy",
  "pandas",
  "scikit-learn>=1.8.0",
  "scipy>=1.18.0",
]

[project.scripts]
boldtailor = "boldtailor.cli:main"

[dependency-groups]
dev = [
  "black",
  "ipykernel>=7.3.0",
  "matplotlib>=3.11.1",
  "nbclient>=0.11.0",
  "pytest",
  "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py312"]
