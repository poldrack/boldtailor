[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boldtailor"
version = "0.1.0"
description = "Composable first-level fMRI modeling"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "nilearn>=0.14.0,<0.15",
  "numpy",
  "pandas",
]

[dependency-groups]
dev = [
  "black",
  "nibabel",
  "pytest",
  "pytest-cov",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
